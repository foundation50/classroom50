<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The free, open-source alternative to GitHub Classroom. Distribute and auto-grade programming assignments on GitHub."
    />

    <!-- Absolute URLs: unfurlers can't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Classroom 50" />
    <meta property="og:title" content="Classroom 50" />
    <meta
      property="og:description"
      content="The free, open-source alternative to GitHub Classroom. Distribute and auto-grade programming assignments on GitHub."
    />
    <meta property="og:url" content="https://classroom50.org/" />
    <meta property="og:image" content="https://classroom50.org/og-image.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="537" />
    <meta property="og:image:alt" content="Classroom 50 logo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Classroom 50" />
    <meta
      name="twitter:description"
      content="The free, open-source alternative to GitHub Classroom. Distribute and auto-grade programming assignments on GitHub."
    />
    <meta name="twitter:image" content="https://classroom50.org/og-image.jpg" />
    <title>Classroom 50</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    />
    <script>
      // Anti-flash: apply the persisted (or OS-preferred) theme before the app
      // renders so there's no light->dark flicker. Mirrors resolveInitialTheme
      // in src/hooks/useTheme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem("classroom50:theme")
          var theme =
            stored === "sumi" || stored === "sumi-dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "sumi-dark"
                : "sumi"
          document.documentElement.setAttribute("data-theme", theme)
        } catch (e) {}
      })()
      // Anti-flash: apply the persisted language's direction before the app
      // renders so RTL languages don't paint left-to-right first. The RTL
      // subtag list mirrors RTL_LANGS in src/i18n/direction.ts — keep in sync.
      ;(function () {
        try {
          var lang = localStorage.getItem("classroom50:lang")
          if (!lang) return
          document.documentElement.lang = lang
          var primary = lang.toLowerCase().split("-")[0]
          if (["ar", "he", "fa", "ur"].indexOf(primary) !== -1) {
            document.documentElement.dir = "rtl"
          }
        } catch (e) {}
      })()
      // Anti-flash: apply the resolved reduced-motion verdict before the app
      // renders so a motion-off user never sees a first-paint animation. Mirrors
      // motionReduced/resolveInitialMotionPref in src/hooks/useReducedMotion.ts.
      ;(function () {
        try {
          var pref = localStorage.getItem("classroom50:motion")
          var reduced =
            pref === "off"
              ? true
              : pref === "on"
                ? false
                : window.matchMedia &&
                  window.matchMedia("(prefers-reduced-motion: reduce)").matches
          if (reduced) {
            document.documentElement.setAttribute("data-reduce-motion", "true")
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /* Anti-flash: paint the themed canvas before the CSS bundle arrives so a
         dark-mode first load never flashes white. Hand-mirrors --color-base-100
         for each theme in src/index.css — keep in sync. */
      html {
        background-color: #fafafa;
      }
      html[data-theme="sumi-dark"] {
        background-color: #1b1b1d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
