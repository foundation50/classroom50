name: cli Release Please

# Automates CLI extension releases with googleapis/release-please. Day-to-day
# work lands on `main` (all PRs merge straight into main). This workflow watches
# `main` and maintains a *Release PR* that bumps `cli/CHANGELOG.md` from
# Conventional Commits. Merging that Release PR creates the `cli-vX.Y.Z` tag,
# which the existing `cli-release.yaml` workflow consumes to build and publish
# the `gh-teacher` and `gh-student` extensions.
#
# Scoped to cli/ via a cli-only config + manifest
# (release-please-config.cli.json + .release-please-manifest.cli.json). The web
# app has its OWN pair; the two workflows must never share one config listing
# both packages, or they race to release both packages against the single
# Release PR (see web-release-please.yaml for the failure mode). The `cli-v*` tag
# scheme is namespaced apart from the web app's `web-v*` tags.
#
# Token model: release-please runs with CLI_RELEASE_PAT (a PAT), NOT the default
# GITHUB_TOKEN, for two reasons that GITHUB_TOKEN can't satisfy: (1) a tag pushed
# by GITHUB_TOKEN does NOT retrigger cli-release.yaml (Actions' recursion guard),
# but a PAT-pushed tag does — and cli-release.yaml is what builds and publishes
# the extensions; (2) cli-release.yaml's publish step writes Releases to the
# separate foundation50/gh-teacher and foundation50/gh-student repos, which
# GITHUB_TOKEN (scoped to this repo only) cannot do. (Opening the Release PR also
# requires "Allow GitHub Actions to create and approve pull requests".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cli-release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # `cli--*` keys because component is "cli" (see release-please-config).
      release_created: ${{ steps.release.outputs['cli--release_created'] }}
      tag_name: ${{ steps.release.outputs['cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.CLI_RELEASE_PAT }}
          target-branch: main
          config-file: release-please-config.cli.json
          manifest-file: .release-please-manifest.cli.json
