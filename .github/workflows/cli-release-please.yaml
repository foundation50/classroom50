name: cli Release Please

# Automates CLI extension releases with googleapis/release-please. Day-to-day
# work lands on `main` (all PRs merge straight into main). This workflow watches
# `main` and maintains a *Release PR* that bumps `cli/CHANGELOG.md` from
# Conventional Commits. Merging that Release PR creates the `cli-vX.Y.Z` tag,
# which the existing `cli-release.yaml` workflow consumes to build and publish
# the `gh-teacher` and `gh-student` extensions.
#
# Scoped to cli/ via a cli-only config + manifest
# (release-please-config.cli.json + .release-please-manifest.cli.json), with
# `separate-pull-requests: true` so this workflow's Release PR gets its own
# component-suffixed branch instead of colliding with web (see
# web-release-please.yaml for the shared-branch failure mode). The `cli-v*` tags
# are namespaced apart from the web app's `web-v*`.
#
# Token model: release-please runs with CLI_RELEASE_PAT, NOT GITHUB_TOKEN, for
# two reasons GITHUB_TOKEN can't satisfy: (1) a GITHUB_TOKEN-pushed tag does NOT
# retrigger cli-release.yaml (recursion guard), but a PAT-pushed one does — and
# that workflow builds/publishes the extensions; (2) it writes Releases to the
# separate foundation50/gh-teacher + gh-student repos, out of GITHUB_TOKEN's
# scope. (Opening the Release PR also needs "Allow GitHub Actions to create and
# approve pull requests".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cli-release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.CLI_RELEASE_PAT }}
          target-branch: main
          config-file: release-please-config.cli.json
          manifest-file: .release-please-manifest.cli.json

      # release-please marks every release it creates as "Latest" (no make_latest
      # option — googleapis/release-please#2317), so the cli-v* release would
      # steal the badge that should track the web app (classroom50.org). Demote
      # it here; web-release-please.yaml asserts web as latest. `cli--*` output
      # keys use the component name "cli".
      - name: Ensure CLI release is not marked latest
        if: ${{ steps.release.outputs['cli--tag_name'] != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs['cli--tag_name'] }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false
