name: Publish wiki

# Publishes this repo's wiki/ directory to the repo's GitHub wiki
# (foundation50/classroom50.wiki.git) on every push to `main` that touches
# wiki/**. Manual runs are available from the Actions tab.
#
# Source of truth: wiki/ in this repo. The wiki repo is downstream-only —
# it's overwritten on every publish, so direct edits there (including via the
# GitHub UI) are lost. To edit the wiki, change wiki/ and push to main.
# Because it pushes to the SAME repo's wiki, the built-in GITHUB_TOKEN with
# `contents: write` is sufficient (no PAT needed).
#
# One-time setup: enable the wiki and create at least one page via the
# GitHub UI (Settings -> Features -> Wikis). GitHub does not initialize the
# wiki repo until the first page exists, and this workflow fails to clone it
# until then.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure git identity
        run: |
          git config --global user.name "classroom50-sync[bot]"
          git config --global user.email "classroom50-sync@users.noreply.github.com"

      - name: Publish wiki content
        env:
          SYNC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/wiki"
          if [ ! -d "$src" ] || [ -z "$(ls -A "$src" 2>/dev/null)" ]; then
            echo "No wiki/ content; nothing to publish."
            exit 0
          fi

          short=$(printf '%s' "$SOURCE_SHA" | cut -c1-7)

          work=$(mktemp -d)
          cd "$work"
          remote="https://x-access-token:${SYNC_TOKEN}@github.com/${TARGET_REPO}.wiki.git"
          if ! git clone --quiet "$remote" wiki; then
            echo "::error::Could not clone ${TARGET_REPO}.wiki.git. Enable the wiki on ${TARGET_REPO} and create at least one page (e.g., Home) via the GitHub UI to initialize the wiki repo, then re-run this workflow."
            exit 1
          fi
          cd wiki

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a "$src"/ ./

          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki already up to date."
            exit 0
          fi

          git add -A
          git commit -q -m "Sync from ${TARGET_REPO}@${short}"
          git push origin "$(git symbolic-ref --short HEAD)"
