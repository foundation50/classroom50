name: web Release

# Creates a GitHub Release for the web app when a `web-v*` tag is pushed. The
# actual production deploy of that tag is handled by web-deploy.yaml (which also
# triggers on `web-v*` and stamps the version into the build); this workflow
# only publishes the human-facing Release + auto-generated notes, so "what is
# live on classroom50.org" has a versioned, changelog-backed answer.
#
# Release model: day-to-day work lands on `preview`; a release PR merges
# preview -> main; then a `web-v*` tag is cut from the resulting main commit.
# The tag scheme (`web-v*`) is namespaced apart from the CLI's `cli-v*` tags so
# both can live in this monorepo without collision. web/package.json is the
# version source of truth — bump it in the release PR, then tag to match.
#
# Versioning: vMAJOR.MINOR.PATCH[-prerelease]. A tag containing `-`
# (web-v1.1.0-rc.1) publishes as a prerelease.

on:
  push:
    tags: ['web-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. web-v1.0.0).'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: web-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so --generate-notes can diff against the previous tag.
          fetch-depth: 0

      - name: Resolve and validate tag
        id: tag
        # Bind the untrusted input to env and use the shell var — never
        # interpolate ${{ }} into run: (script injection; the dispatch input
        # bypasses the web-v* push filter).
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#web-v}"
          if [ "$version" = "$TAG" ]; then
            echo "::error::Tag '$TAG' does not start with the 'web-v' prefix; expected e.g. web-v1.0.0."
            exit 1
          fi
          # Restrict to a semver shape and charset before it reaches the CLI.
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Version '$version' is not MAJOR.MINOR.PATCH[-prerelease] (from tag '$TAG')."
              exit 1
              ;;
          esac
          case "$version" in
            *[!0-9A-Za-z.+_-]*)
              echo "::error::Version '$version' contains characters outside [0-9A-Za-z.+_-] (from tag '$TAG')."
              exit 1
              ;;
          esac
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Guard against tag/source drift: the tag version must match the version
      # in web/package.json (the source of truth), so a release can't ship
      # claiming a version the build wasn't stamped with.
      - name: Assert package.json version matches tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./web/package.json').version")"
          if [ "$pkg_version" != "$VERSION" ]; then
            echo "::error::web/package.json version ($pkg_version) does not match tag version ($VERSION). Bump package.json in the release PR before tagging."
            exit 1
          fi

      # Extract this version's section from web/CHANGELOG.md (Keep a Changelog
      # format) to use as the release body. Falls back to gh's auto-generated
      # notes when the section is absent (e.g. a prerelease not yet written up).
      - name: Extract changelog section
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          changelog="web/CHANGELOG.md"
          body_file="$RUNNER_TEMP/release-notes.md"
          # Print lines from the matching `## [VERSION]` heading up to (but not
          # including) the next `## ` heading. Match the version bracket exactly
          # so 1.0.0 doesn't also grab 1.0.0-rc.1.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## / { grab=0 }
            grab { print }
          ' "$changelog" | sed '/./,$!d' >"$body_file" || true

          if [ -s "$body_file" ]; then
            echo "Using web/CHANGELOG.md section for $VERSION."
            echo "has_notes=true" >>"$GITHUB_OUTPUT"
            echo "body_file=$body_file" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::No web/CHANGELOG.md section for $VERSION; falling back to auto-generated notes."
            echo "has_notes=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          REPO: ${{ github.repository }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
          BODY_FILE: ${{ steps.notes.outputs.body_file }}
        run: |
          set -euo pipefail
          prerelease="false"
          case "$VERSION" in
            *-*) prerelease="true" ;;
          esac
          # Prefer the curated changelog section; else let gh generate notes.
          if [ "$HAS_NOTES" = "true" ]; then
            notes_args=(--notes-file "$BODY_FILE")
          else
            notes_args=(--generate-notes)
          fi
          # Idempotent: create the Release once (notes set once), then reconcile
          # prerelease state on re-run — a retried run won't duplicate notes.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "web $VERSION" \
              "${notes_args[@]}" \
              --prerelease="$prerelease"
          else
            echo "Release $TAG already exists on $REPO; reconciling prerelease state."
            gh release edit "$TAG" --repo "$REPO" --prerelease="$prerelease"
          fi
