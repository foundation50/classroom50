name: CLI CI

# Unified Go CI for the three CLI modules (cli/shared, cli/gh-student,
# cli/gh-teacher). They ran as three near-identical workflows; this is one
# workflow with a module matrix — the shared gate (tidy, lint, fmt, build, test)
# is defined once, and the per-module bits (working directory, the go-gh importer
# guard) are matrix data.
#
# The go-gh importer guard runs only for gh-student/gh-teacher: cli/shared is the
# API-seam module that MAY import go-gh, so the guard does not apply to it.
#
# Path fan-out: gh-student and gh-teacher depend on cli/shared, so a cli/shared/**
# change must exercise all three modules. The matrix runs every module on any
# trigger, which preserves that guarantee (each leg is a fast Go build+test).

on:
  push:
    branches: [main]
    paths:
      - 'cli/shared/**'
      - 'cli/gh-student/**'
      - 'cli/gh-teacher/**'
      - '.github/workflows/cli-ci.yaml'
  pull_request:
    paths:
      - 'cli/shared/**'
      - 'cli/gh-student/**'
      - 'cli/gh-teacher/**'
      - '.github/workflows/cli-ci.yaml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # cli/shared is the go-gh API seam — the importer guard does not apply.
          - module: shared
            dir: cli/shared
            gh_guard: false
          - module: gh-student
            dir: cli/gh-student
            gh_guard: true
          - module: gh-teacher
            dir: cli/gh-teacher
            gh_guard: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: ${{ matrix.dir }}
          version: v2.12.2

      - name: Format (gofmt + goimports)
        run: |
          diff=$(golangci-lint fmt --diff)
          if [ -n "$diff" ]; then
            echo "::error::Formatter diffs detected (run \`golangci-lint fmt\` locally to apply):"
            echo "$diff"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Single go-gh importer guard
        # The GitHub REST API seam (internal/githubapi) is the ONLY
        # package allowed to import go-gh; internal/githubtest may too
        # because it constructs real clients for white-box tests. Any
        # other non-test file importing it means a domain package
        # reached around the seam — fail the build. Only the gh-* modules
        # have this seam; cli/shared is exempt (gh_guard=false).
        if: ${{ matrix.gh_guard }}
        run: |
          offenders=$(grep -rl --include='*.go' 'github.com/cli/go-gh/v2/pkg/api' . \
            | grep -v '_test\.go$' \
            | grep -v '^\./internal/githubapi/' \
            | grep -v '^\./internal/githubtest/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::go-gh/api may only be imported by internal/githubapi (and internal/githubtest for test clients). Offending files:"
            echo "$offenders"
            exit 1
          fi

      - name: Test
        run: go test ./...
